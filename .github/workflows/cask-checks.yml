name: cask checks

on:
  pull_request:
    paths:
      - 'Casks/**'
      - '.github/workflows/cask-checks.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  casks:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          cask: true

      - name: Find changed casks
        id: changed
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const casks = files.filter(({ filename }) => /^Casks\/[^/]+\.rb$/.test(filename));
            const tokenFor = ({ filename }) => filename.slice("Casks/".length, -".rb".length);
            const changed = casks
              .filter(({ status }) => status !== "removed")
              .map(tokenFor);
            const added = casks
              .filter(({ status }) => status === "added")
              .map(tokenFor);
            core.setOutput("changed", changed.join("\n"));
            core.setOutput("added", added.join("\n"));

      - name: Style check
        if: steps.changed.outputs.changed != ''
        env:
          CASKS: ${{ steps.changed.outputs.changed }}
        run: printf '%s\n' "$CASKS" | xargs brew style

      - name: Audit changed casks
        if: steps.changed.outputs.changed != ''
        env:
          CASKS: ${{ steps.changed.outputs.changed }}
        run: printf '%s\n' "$CASKS" | xargs -n1 brew audit --cask --online

      - name: Audit new casks
        if: steps.changed.outputs.added != ''
        env:
          CASKS: ${{ steps.changed.outputs.added }}
        run: printf '%s\n' "$CASKS" | xargs -n1 brew audit --cask --new
