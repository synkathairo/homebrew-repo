name: Bump casks (using macos runner)

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to livecheck and bump if outdated
        required: false
  schedule:
    # - cron: "23 */3 * * *"
    - cron: "0 6 * * *" # daily

permissions:
  contents: write
  pull-requests: write

jobs:
  autobump:
    if: github.repository == 'synkathairo/homebrew-repo'
    env:
      HOMEBREW_DEVELOPER: 1
      # HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_SIMULATE_MACOS_ON_LINUX: 1
      # HOMEBREW_NO_ANALYTICS: 1
    runs-on: macos-26
    # runs-on: ubuntu-latest
    steps:
      - name: Create Homebrew bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BREW_COMMIT_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      - name: Configure Git user
        id: git-user-config
        uses: Homebrew/actions/git-user-config@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          username: ${{ steps.app-token.outputs.app-slug }}[bot]

      - name: Bump casks
        id: autobump
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git-user-config.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git-user-config.outputs.email }}
          CASKS: ${{ inputs.casks }}
        run: |
          BREW_BUMP=(brew bump --no-fork --open-pr --casks)

          if [[ -n "${CASKS-}" ]]; then
            xargs "${BREW_BUMP[@]}" <<<"${CASKS}"
          else
            "${BREW_BUMP[@]}" --tap=synkathairo/repo
          fi
