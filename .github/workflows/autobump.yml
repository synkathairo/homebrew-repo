name: Bump casks (using macos runner)

on:
  workflow_dispatch:
    inputs:
      casks:
        description: Custom list of casks to livecheck and bump if outdated
        required: false
  schedule:
    # - cron: "23 */3 * * *"
    - cron: "0 6 * * *" # daily

permissions:
  contents: write
  pull-requests: write

jobs:
  autobump:
    if: github.repository == 'synkathairo/homebrew-repo'
    env:
      HOMEBREW_DEVELOPER: 1
      # HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_SIMULATE_MACOS_ON_LINUX: 1
      # HOMEBREW_NO_ANALYTICS: 1
    runs-on: macos-26
    # runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      - name: Configure Git user
        uses: Homebrew/actions/git-user-config@main
        with:
          username: github-actions[bot]

      - name: Bump casks
        id: autobump
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: github-actions[bot]
          HOMEBREW_GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          CASKS: ${{ inputs.casks }}
        run: |
          BREW_BUMP=(brew bump --no-fork --open-pr --casks)

          if [[ -n "${CASKS-}" ]]; then
            xargs "${BREW_BUMP[@]}" <<<"${CASKS}"
          else
            "${BREW_BUMP[@]}" --tap=synkathairo/repo
          fi
