name: Auto-bottle autobump PRs

# After the "brew test-bot" run for a pull request finishes successfully,
# automatically add the `pr-pull` label to autobump PRs. That label triggers
# publish.yml (brew pr-pull), which pulls the built bottle artifacts and writes
# the `bottle do` blocks into the formula files on the default branch.
#
# Scoped to autobump PRs only (head branch starts with "bump-", which is what
# dawidd6/action-homebrew-bump-formula creates) to avoid auto-publishing
# hand-written PRs.

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types:
      - completed

jobs:
  tag:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Label passed autobump PRs with pr-pull
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            const labeled = [];
            for (const pr of prs) {
              // Only auto-bottle PRs opened by the formula autobump action.
              const branch = pr.head && pr.head.ref;
              if (!branch || !branch.startsWith('bump-')) continue;
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['pr-pull'],
              });
              labeled.push(pr.number);
            }
            console.log('Labeled with pr-pull:', labeled);
