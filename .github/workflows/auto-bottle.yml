name: Auto-bottle autobump PRs

# After the "brew test-bot" run for a pull request finishes successfully,
# automatically add the `pr-pull` label to autobump PRs. That label triggers
# publish.yml (brew pr-pull), which pulls the built bottle artifacts and writes
# the `bottle do` blocks into the formula files on the default branch.
#
# Scoped to autobump PRs only (head branch starts with "bump-", which is what
# dawidd6/action-homebrew-bump-formula creates) to avoid auto-publishing
# hand-written PRs.

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types:
      - completed

jobs:
  tag:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read
      pull-requests: write
    steps:
      # Use the App rather than GITHUB_TOKEN so the label event starts
      # publish.yml. Installation tokens are generated fresh for every run.
      - name: Create Homebrew bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BREW_COMMIT_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Label passed autobump PRs with pr-pull
        uses: actions/github-script@v7
        env:
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            const labeled = [];
            for (const pr of prs) {
              // Only trust formula autobumps created in this repository.
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              if (pullRequest.user.login !== process.env.BOT_LOGIN ||
                  pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  !pullRequest.head.ref.startsWith('bump-')) continue;

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              if (!files.length || files.some(({ filename }) => !filename.startsWith('Formula/'))) continue;

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['pr-pull'],
              });
              labeled.push(pr.number);
            }
            console.log('Labeled with pr-pull:', labeled);
