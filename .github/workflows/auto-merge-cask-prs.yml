name: Auto-merge tested cask bump PRs

# Merge cask-only bot PRs after the complete test-bot matrix succeeds. This
# avoids depending on the bump sweep's final status: that sweep can open valid
# PRs and still fail later while checking another cask.
on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-cask-pr:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - name: Create Homebrew bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.BREW_COMMIT_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge tested bot cask bumps
        uses: actions/github-script@v9
        env:
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = context.payload.workflow_run;
            const candidates = run
              ? (run.pull_requests || []).map(({ number }) => number)
              : (await github.paginate(github.rest.pulls.list, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'open',
                })).map(({ number }) => number);

            for (const number of [...new Set(candidates)]) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });

              const trustedAuthors = new Set([process.env.BOT_LOGIN, 'github-actions[bot]']);
              const trustedBotCaskPr =
                trustedAuthors.has(pullRequest.user.login) &&
                pullRequest.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` &&
                pullRequest.head.ref.startsWith('bump-') &&
                pullRequest.base.ref === context.payload.repository.default_branch &&
                !pullRequest.draft;
              if (!trustedBotCaskPr) continue;

              // Do not merge a different revision if the PR changed after the
              // successful workflow run completed.
              if (run && pullRequest.head.sha !== run.head_sha) {
                core.warning(`Skipping #${number}: tested SHA is no longer current`);
                continue;
              }

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });
              if (!files.length || files.some(({ filename }) => !filename.startsWith('Casks/'))) continue;

              // A manual run has no associated successful test workflow, so
              // only merge PRs that GitHub currently reports as clean.
              if (!run && pullRequest.mergeable_state !== 'clean') {
                core.warning(`Skipping #${number}: merge state is ${pullRequest.mergeable_state}`);
                continue;
              }

              const { data: result } = await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
                merge_method: 'squash',
                sha: pullRequest.head.sha,
              });

              if (!result.merged) {
                core.setFailed(`GitHub did not merge #${number}: ${result.message}`);
                continue;
              }
              core.info(`Merged tested cask bump PR #${number}`);
            }
