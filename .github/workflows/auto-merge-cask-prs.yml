name: Auto-merge cask bump PRs

on:
  workflow_run:
    workflows:
      - "Bump casks (using macos runner)"
      - "Bump casks (using ubuntu runner)"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for bot cask bumps
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const candidates = (await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            })).map(({ number }) => number);

            for (const number of [...new Set(candidates)]) {
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });

              if (pullRequest.user.login !== 'github-actions[bot]' ||
                  !pullRequest.head.ref.startsWith('bump-')) continue;

              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: number,
              });

              if (!files.length || files.some(({ filename }) => !filename.startsWith('Casks/'))) continue;

              await github.graphql(`
                mutation($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number }
                  }
                }
              `, { pullRequestId: pullRequest.node_id });

              core.info(`Enabled auto-merge for #${number}`);
            }
