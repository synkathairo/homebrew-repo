name: Bump All Tap Formulas

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-taps:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_SIMULATE_MACOS_ON_LINUX: 1
    steps:
      # GitHub App installation tokens are intentionally short-lived. Generate
      # a fresh least-privilege token for each workflow run.
      - name: Create Homebrew bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.HOMEBREW_BOT_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Get Homebrew bot user ID
        id: bot-user
        env:
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_user_id="$(gh api "users/${BOT_LOGIN}" --jq .id)"
          echo "user-id=${bot_user_id}" >> "$GITHUB_OUTPUT"

      - name: Check and bump all formulas
        uses: dawidd6/action-homebrew-bump-formula@v10
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ steps.app-token.outputs.token }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.bot-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        with:
          token: ${{ steps.app-token.outputs.token }}

          # Tell the action to look at your tap
          tap: synkathairo/repo

          # Enable livecheck mode to sweep the entire repository
          livecheck: true

          # This action always opens a PR for each outdated formula (via
          # `brew bump-formula-pr`). `force` only forwards `--force` to that
          # command, i.e. "don't fail if a bump PR for this formula already
          # exists" -- it does not push directly to master.
          force: true

          user_name: "${{ steps.app-token.outputs.app-slug }}[bot]"
          user_email: "${{ steps.bot-user.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
